# Pages CMS / GitHub-backed authoring for Tiany1Yu.github.io
# https://pagescms.org/docs/configuration/
# Read on the master branch after the repository owner installs the Pages CMS GitHub App.
media:
  - name: images
    label: 图片素材
    input: assets/img
    output: /assets/img
    rename: safe
    extensions: [png, jpg, jpeg, webp, gif, avif, svg, ico]

settings:
  content:
    # Existing migrated posts contain a legacy slug and other frontmatter keys.
    # Keep all keys not explicitly edited in the CMS.
    merge: true
  commit:
    identity: app
    templates:
      create: "content: publish {path}"
      update: "content: update {path}"
      delete: "content: delete {path}"
      rename: "content: rename {oldPath} to {newPath}"

content:
  - name: writing
    label: 文章
    type: collection
    path: astro/src/content/posts/writing
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    operations:
      create: true
      rename: false
      delete: false
    view:
      primary: title
      fields: [title, published, tags, draft, category]
      sort: [published, title]
      default:
        sort: published
        order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: published
        label: 发布日期
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updated
        label: 更新日期（选填）
        type: date
        required: false
        default: ""
        options:
          format: yyyy-MM-dd
      - name: description
        label: 摘要
        type: text
        required: false
      - name: category
        label: 分类
        type: string
        default: 文章
        required: false
      - name: tags
        label: 标签（可多选）
        type: reference
        required: false
        description: 选择或搜索已有标签；新标签请先在「标签库」中新建并保存，再返回本文选择。
        options:
          collection: tag_library
          multiple: true
          search: name
          value: "{primary}"
          label: "{primary}"
      - name: image
        label: 封面图片
        type: image
        required: false
        options:
          media: images
      - name: lang
        label: 语言
        type: string
        default: zh_CN
        hidden: true
      - name: draft
        label: 草稿（关闭后发布）
        type: boolean
        default: true
        description: "新建内容默认不会出现在网站；写好后关闭草稿并保存。"
      - name: body
        label: Markdown 正文
        type: code
        required: true
        options:
          format: markdown

  - name: notes
    label: 笔记花园
    type: collection
    path: astro/src/content/posts/notes
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    operations:
      create: true
      rename: false
      delete: false
    view:
      primary: title
      fields: [title, published, tags, draft]
      sort: [published, title]
      default:
        sort: published
        order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: published
        label: 记录日期
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updated
        label: 更新日期（选填）
        type: date
        required: false
        default: ""
        options:
          format: yyyy-MM-dd
      - name: description
        label: 摘要
        type: text
        required: false
      - name: category
        label: 分类
        type: string
        default: 笔记花园
        hidden: true
      - name: tags
        label: 标签（可多选）
        type: reference
        required: false
        description: 选择或搜索已有标签；新标签请先在「标签库」中新建并保存，再返回本文选择。
        options:
          collection: tag_library
          multiple: true
          search: name
          value: "{primary}"
          label: "{primary}"
      - name: image
        label: 配图
        type: image
        required: false
        options:
          media: images
      - name: lang
        label: 语言
        type: string
        default: zh_CN
        hidden: true
      - name: draft
        label: 草稿（关闭后发布）
        type: boolean
        default: true
      - name: body
        label: Markdown / LaTeX 正文
        type: code
        required: true
        options:
          format: markdown

  - name: projects
    label: 项目
    type: collection
    path: astro/src/content/projects
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    operations:
      create: true
      rename: false
      delete: false
    view:
      primary: title
      fields: [title, date, venue, draft]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 项目名称
        type: string
        required: true
      - name: description
        label: 一句话介绍
        type: text
        required: false
      - name: date
        label: 日期
        type: date
        required: false
        options:
          format: yyyy-MM-dd
      - name: venue
        label: 会议 / 期刊
        type: string
        required: false
      - name: image
        label: 项目主图
        type: image
        required: false
        options:
          media: images
      - name: github
        label: GitHub 仓库网址
        type: string
        required: false
      - name: paper
        label: 论文网址
        type: string
        required: false
      - name: draft
        label: 草稿（关闭后发布）
        type: boolean
        default: true
      - name: body
        label: 项目介绍
        type: rich-text
        required: false
        options:
          format: markdown
          switcher: true
          media: images

  # Editable global tag vocabulary. Pages CMS reference fields in writing/notes
  # read these entries dynamically and still save tags: ["tag", "tag2"].
  # Kept outside astro/src/content to avoid creating a new Astro content collection.
  - name: tag_library
    label: 标签库
    type: collection
    path: cms/tags
    format: yaml
    filename:
      template: "{primary}.yml"
      field: create
    operations:
      create: true
      rename: false
      delete: false
    view:
      primary: name
      fields: [name, description]
      search: [name]
      sort: [name]
      default:
        sort: name
        order: asc
    fields:
      - name: name
        label: 标签名称
        type: string
        required: true
        description: 标签名称将存入文章的 tags 数组；创建后不要直接改名，旧文章不会自动重命名。
      - name: description
        label: 标签说明（选填）
        type: text
        required: false
